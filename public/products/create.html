<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create product</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/assets/js/product.scripts.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1>Create New Product</h1>
        <form id="frmProduct">
            <div class="mb-3 row">
                <label for="product" class="col-sm-2 col-form-label">Title</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="product" id="product" aria-describedby="product">
                </div>
            </div>
            <div class="mb-3 row">
                <label for="" class="col-sm-2 col-form-label">Cost</label>
                <div class="col-sm-10">
                    <input type="number" class="form-control" name="cost" id="cost">
                </div>
            </div>
            <div class="mb-3 row">
                <label for="description" class="col-sm-2 col-form-label">Description</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="description" id="description">
                </div>
            </div>
            <div class="mb-3 row">
                <label for="quantity" class="col-sm-2 col-form-label">Quantity</label>
                <div class="col-sm-10">
                    <input type="number" class="form-control" name="quantity" id="quantity">
                </div>
            </div>

        <div class="row">
            <div class="col text-center">
            <button type="submit" class="btnSubmit btn btn-primary text-center" value="insert">Submit</button>
            <button type="reset" class="btnReset btn btn-primary text-center">Reset</button>
            </div>
        </div>
        <br>
        <div class="row">
            <div class="col text-center">
            <a href="/index.html" class="btn btn-primary">Back</a>
            </div>
        </div>
        </form>
    </div>    
</body>
</html>
